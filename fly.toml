# ==============================================================================
# Vanta Deep Research — Fly.io Deployment Config (fly.toml)
# https://fly.io/docs/reference/configuration/
# ==============================================================================

app = "vanta-deep-research-api"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  ENVIRONMENT = "production"
  SINGLE_CONTAINER_MODE = "true"
  SEARXNG_URL = "https://searxng.org"
  MAX_RESEARCH_ROUNDS = "3"
  EXTRACTION_CONCURRENCY = "3"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
