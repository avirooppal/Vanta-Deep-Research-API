# ==============================================================================
# Vanta Deep Research — Render Blueprint (render.yaml)
# https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  # ─── Vanta Deep Research Web Service (FastAPI + Embedded Worker) ───────────
  - type: web
    name: vanta-backend
    runtime: docker
    dockerfilePath: deploy/Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vanta-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vanta-redis
          property: connectionString
      - key: SINGLE_CONTAINER_MODE
        value: "true"
      - key: SEARXNG_URL
        value: "https://searxng.org"
      - key: MAX_RESEARCH_ROUNDS
        value: "3"
      - key: EXTRACTION_CONCURRENCY
        value: "3"
    healthCheckPath: /health

# ─── Managed Redis on Render ──────────────────────────────────────────────────
  - type: redis
    name: vanta-redis
    plan: starter
    region: oregon
    ipAllowList: []

# ─── Managed PostgreSQL with pgvector on Render ───────────────────────────────
databases:
  - name: vanta-postgres
    plan: starter
    region: oregon
    postgresMajorVersion: 16
