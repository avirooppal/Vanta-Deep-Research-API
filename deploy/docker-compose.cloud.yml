# ==============================================================================
# Vanta Deep Research — Cloud VPS Docker Compose (with Automatic HTTPS)
# Usage:
#   docker compose -f deploy/docker-compose.cloud.yml --env-file deploy/.env.cloud up -d --build
# ==============================================================================

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://postgres:${PG_PASSWORD}@postgres:5432/drapi
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY}
  SEARXNG_URL: http://searxng:8080
  ENVIRONMENT: production
  MAX_RESEARCH_ROUNDS: ${MAX_RESEARCH_ROUNDS:-3}
  EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-3}

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile

x-restart: &restart
  restart: always

services:
  # ─── Caddy: Automated Let's Encrypt SSL & Reverse Proxy ─────────────────────
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── API Server ─────────────────────────────────────────────────────────────
  api:
    <<: *restart
    image: vanta-api:cloud
    build: *build
    expose:
      - "8000"
    environment:
      <<: *api-env
      PORT: "8000"
      SINGLE_CONTAINER_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Background Worker (ARQ) ────────────────────────────────────────────────
  worker:
    <<: *restart
    image: vanta-api:cloud
    build: *build
    command: python -m arq core.queue.worker.WorkerSettings
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── PostgreSQL + pgvector (Internal only, not exposed to internet) ────────
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: drapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drapi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (Internal only, not exposed to internet) ─────────────────────────
  redis:
    <<: *restart
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── SearXNG Metasearch Engine ──────────────────────────────────────────────
  searxng:
    <<: *restart
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      INSTANCE_NAME: vanta-searxng-cloud
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
